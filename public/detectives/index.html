<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego para preparar la prueba de competencias de 4.º: leer, elegir la operación, estimar, calcular y comprobar.">
<title>Detectives de Problemas</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
@font-face { font-family: "Andika"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/andika-400.woff2") format("woff2"); }
@font-face { font-family: "Andika"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/andika-700.woff2") format("woff2"); }
@font-face { font-family: "Lilita One"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/lilita-one-400.woff2") format("woff2"); }
@font-face { font-family: "Patrick Hand"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/patrick-hand-400.woff2") format("woff2"); }
/* Layout: un pueblo ilustrado bajo el cielo; cada caso es una hoja de cuaderno de cuadros
   (columna izquierda) junto al zorro detective que guía los 5 pasos (columna derecha). */
:root {
  --ink: #22304F; --ink-2: #56627F; --ink-3: #8A93A8;
  --sky: #9EDCF7; --sky-2: #E6F6FF;
  --paper: #FFFFFF; --grid: #DDE9F7; --margin: #F3A0AE; --cream: #FFF6EE;
  --fox: #FF7A2F; --fox-d: #C9541A;
  --leaf: #2FB36B; --leaf-d: #1E7F4B; --leaf-l: #D7F6E4;
  --berry: #E8476A; --berry-d: #B52C4D; --berry-l: #FFE1E8;
  --gold: #FFC23D; --gold-d: #C98A06; --gold-l: #FFF0C7;
  --plum: #5B4BB7; --plum-d: #3F3290; --plum-l: #ECE8FF;
  --blue: #36A9E1; --blue-l: #DDF1FC;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Andika", "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
  --r: 20px;
  color-scheme: light;
}
html, body { min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky) 0, var(--sky-2) 420px, var(--sky-2) 100%);
  color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; border-radius: 10px; }
.ico { width: 1.25em; height: 1.25em; flex: none; }

/* ---------- botones ---------- */
.btn {
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  font-family: var(--f-display); font-size: 1.25rem; letter-spacing: .02em;
  padding: .62em 1.2em; min-height: 56px; border-radius: 18px;
  border: 3px solid var(--ink); background: var(--gold); color: var(--ink);
  box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.btn.fox { background: var(--fox); color: #fff; }
.btn.leaf { background: var(--leaf); color: #fff; }
.btn.plum { background: var(--plum); color: #fff; }
.btn.white { background: var(--paper); }
.btn.small { font-size: 1rem; min-height: 44px; padding: .4em .9em; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.btn.wide { width: 100%; }
.icon-btn {
  display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
  border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 4px 0 var(--ink); padding: 0;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn .ico { width: 26px; height: 26px; }

/* ---------- barra superior ---------- */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.tb-c { flex: 1; min-width: 0; text-align: center; }
.tb-c h2 { font-size: clamp(1.3rem, 3.4vw, 1.9rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-c .sub { font-size: .95rem; color: var(--ink-2); font-weight: 700; }
.tb-l, .tb-r { display: flex; gap: 8px; align-items: center; }
.pips { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); }
.pip.now { background: var(--fox); }
.pip.s1 { background: #FFE08A; } .pip.s2 { background: #FFCF4D; } .pip.s3 { background: var(--gold); box-shadow: 0 0 0 3px var(--gold-l); }
.star-count { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-display); font-size: 1.2rem; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 10px; height: 48px; }
.star-count .stars { width: 26px; height: 26px; }

/* ---------- portada ---------- */
.home { display: grid; gap: 20px; }
.home-top { display: flex; justify-content: flex-end; gap: 8px; }
.lang { display: inline-flex; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 var(--ink); background: var(--paper); }
.lang button { border: 0; background: transparent; font-family: var(--f-display); font-size: 1.05rem; padding: 0 14px; height: 42px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.hero {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: center;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px; overflow: hidden;
}
.hero-art { position: relative; height: 230px; margin: -22px -22px 0; overflow: hidden; border-bottom: 3px solid var(--ink); }
.hero-art .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-art .fox { position: absolute; bottom: -8px; left: 50%; width: 190px; transform: translateX(-50%); filter: drop-shadow(0 6px 0 rgba(34,48,79,.18)); }
.logo { font-size: clamp(2.6rem, 9vw, 4.6rem); color: var(--fox); text-shadow: 3px 3px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; line-height: .95; }
.logo span { display: block; color: var(--gold); font-size: .62em; margin-top: .1em; }
.tagline { font-size: 1.15rem; color: var(--ink-2); max-width: 46ch; }
.home-actions { display: grid; gap: 14px; }
.rank-card { display: flex; align-items: center; gap: 14px; background: var(--gold-l); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 16px; }
.rank-card .badge { width: 54px; flex: none; }
.rank-card b { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; display: block; line-height: 1.1; }
.rank-card small { color: var(--ink-2); font-weight: 700; font-size: .92rem; }
.meter { height: 12px; border-radius: 6px; background: var(--paper); border: 2px solid var(--ink); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--gold); border-right: 2px solid var(--ink); }
.method { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: st; }
.method li { list-style: none; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 10px; text-align: center; box-shadow: 0 5px 0 var(--ink); counter-increment: st; }
.method .ico { width: 38px; height: 38px; color: var(--fox); }
.method b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; }
.method b::before { content: counter(st) ". "; color: var(--ink-3); }
.method span { font-size: .9rem; color: var(--ink-2); line-height: 1.3; display: block; }
.method-wrap { margin: 0; padding: 0; }
@media (min-width: 860px) {
  .hero { grid-template-columns: 1.05fr 1fr; padding: 28px; }
  .hero-art { grid-column: 2; grid-row: 1 / span 2; height: 100%; min-height: 380px; margin: -28px -28px -28px 0; border-bottom: 0; border-left: 3px solid var(--ink); }
  .hero-art .fox { width: 250px; }
}
@media (max-width: 700px) {
  .method { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .method li { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; align-items: center; text-align: left; padding: 10px 14px; border-radius: 16px; box-shadow: 0 4px 0 var(--ink); }
  .method .ico { grid-row: span 2; width: 34px; height: 34px; }
}

/* ---------- mapa ---------- */
.map-wrap { background: var(--paper); border: 3px solid var(--ink); border-radius: 28px; overflow: hidden; box-shadow: 0 8px 0 var(--ink); }
.map { display: block; width: 100%; height: auto; }
.map-scroll { overflow-x: auto; }
.map-scroll .map { min-width: 620px; }
.spot { cursor: pointer; }
.spot .bld { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .2s; }
.spot:hover .bld, .spot:focus-visible .bld { transform: scale(1.07); }
.spot.locked { cursor: not-allowed; }
.spot.locked .bld { filter: grayscale(1) opacity(.55); }
.spot.current .bld { animation: hop 1.6s ease-in-out infinite; }
.spot:focus-visible { outline: none; }
.spot:focus-visible rect { stroke: var(--blue); }
.spot-name { font-family: var(--f-display); font-size: 21px; fill: var(--ink); }
.map-fox { pointer-events: none; }
.map-hint { text-align: center; color: var(--ink-2); font-weight: 700; margin-top: 14px; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* ---------- pasos ---------- */
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0 0 14px; padding: 0; }
.stepper li { list-style: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 6px; border-radius: 14px; background: rgba(255,255,255,.6); border: 3px solid transparent; color: var(--ink-3); font-family: var(--f-display); font-size: 1.05rem; }
.stepper .ico { width: 28px; height: 28px; }
.stepper li.now { background: var(--paper); border-color: var(--ink); color: var(--fox); box-shadow: 0 4px 0 var(--ink); }
.stepper li.now .st-l { color: var(--ink); }
.stepper li.done { color: var(--leaf-d); background: var(--leaf-l); }
@media (max-width: 640px) {
  .stepper .st-l { display: none; }
  .notebook { padding: 14px 12px 18px 30px; background-size: 22px 22px; }
  .notebook::before { left: 18px; }
  .chart-box { padding: 6px 2px 2px; margin-left: -8px; }
  .panel { padding: 14px; }
  .coach { grid-template-columns: 88px minmax(0, 1fr); }
  .coach-fox .fox { width: 88px; }
}

/* ---------- caso ---------- */
.play-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 940px) { .play-grid { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); align-items: start; } .panel-col { position: sticky; top: 12px; } }
.case-col { display: grid; gap: 0; min-width: 0; }
.scene-wrap { border: 3px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0; overflow: hidden; background: var(--sky); }
.scene { display: block; width: 100%; height: clamp(120px, 21vw, 200px); }
.notebook {
  position: relative; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size: 26px 26px; background-position: -1px -1px;
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  padding: 18px 20px 22px 46px; min-width: 0;
}
.notebook::before { content: ""; position: absolute; left: 30px; top: 0; bottom: 0; width: 2.5px; background: var(--margin); }
.case-card { border-radius: 0 0 24px 24px; display: grid; gap: 16px; }
.case-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.case-tag { font-family: var(--f-display); font-size: 1.05rem; background: var(--ink); color: var(--cream); padding: 4px 14px; border-radius: 999px; letter-spacing: .03em; }
.case-text { font-size: clamp(1.18rem, 2.4vw, 1.4rem); line-height: 1.9; }
.tk {
  display: inline; font: inherit; font-weight: 700; color: var(--ink);
  background: var(--blue-l); border: 0; border-bottom: 3px dashed #8DB3DD; border-radius: 8px;
  padding: .06em .32em; margin: 0 .04em; line-height: 1.4; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
button.tk:hover { background: #C9E8FA; }
span.tk { cursor: default; background: transparent; border-bottom-color: transparent; padding: 0; }
.tk.ok { background: var(--leaf-l); border-bottom: 3px solid var(--leaf); padding: .06em .32em; }
.tk.ok::after { content: " ✓"; color: var(--leaf-d); }
.tk.bad { background: var(--berry-l); border-bottom-color: var(--berry); text-decoration: line-through; text-decoration-color: var(--berry); text-decoration-thickness: 2px; }
.tk.hint { animation: pulse 1s ease-in-out 3; }
.tk.pop { animation: pop .45s ease-out; }
.shake { animation: shake .4s; }
.question { display: flex; gap: 12px; align-items: flex-start; background: var(--gold-l); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: clamp(1.15rem, 2.3vw, 1.32rem); line-height: 1.4; }
.question .q-ico { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--fox); display: grid; place-items: center; border: 3px solid var(--ink); }
.question .q-ico svg { width: 20px; height: 20px; }
.chart-box { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 8px 4px; }
.chart-box h3 { font-size: 1.05rem; text-align: center; margin-bottom: 4px; }
.chart { display: block; width: 100%; height: auto; }
.grid-line { stroke: #E2E8F2; stroke-width: 1.5; }
.axis { stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; }
.axis-t { font: 700 15px var(--f-body); fill: var(--ink-2); }
.bar-v { font: 400 25px var(--f-display); fill: var(--ink); }
.bar-l { font: 700 16px var(--f-body); fill: var(--ink); }
.bar.tap { cursor: pointer; }
.bar.tap:hover .bar-r { filter: brightness(1.08); }
.bar.ok .bar-r { stroke: var(--leaf-d); stroke-width: 5; }
.bar.ok .bar-v { fill: var(--leaf-d); }
.bar.bad .bar-r { opacity: .35; }
.bar.hint .bar-r, .prow.hint .prow-bg, .pkey.hint .pkey-bg { stroke: var(--fox); stroke-width: 6; animation: tw .5s ease-in-out 6 alternate; }
.wl-row .lock { width: 28px; height: 28px; color: var(--ink-3); }
.prow-bg { fill: #F4F7FC; stroke: #DCE3EE; stroke-width: 2; }
.prow.tap { cursor: pointer; }
.prow.ok .prow-bg { fill: var(--leaf-l); stroke: var(--leaf); stroke-width: 4; }
.prow.bad .prow-bg { fill: var(--berry-l); stroke: var(--berry); }
.prow-l { font: 400 26px var(--f-display); fill: var(--ink); }
.pkey-bg { fill: var(--gold-l); stroke: var(--ink); stroke-width: 3; }
.pkey.tap { cursor: pointer; }
.pkey.ok .pkey-bg { fill: var(--leaf-l); stroke: var(--leaf-d); stroke-width: 4; }
.pkey-t { font: 400 30px var(--f-display); fill: var(--ink); }
.listen { display: inline-flex; align-items: center; gap: 6px; border: 3px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 4px 14px 4px 10px; font-family: var(--f-display); font-size: 1rem; box-shadow: 0 3px 0 var(--ink); }
.listen .ico { width: 22px; height: 22px; color: var(--blue); }

/* ---------- entrenador ---------- */
.panel-col { display: grid; gap: 14px; min-width: 0; }
.coach { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: end; }
.coach-fox .fox { width: 112px; display: block; }
.fox .fox-eyes { animation: blink 4.5s infinite; transform-origin: 100px 90px; transform-box: view-box; }
.fox .fox-tail { animation: wag 2.4s ease-in-out infinite; transform-origin: 140px 190px; transform-box: view-box; }
.bubble { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 12px 16px; font-size: 1.1rem; font-weight: 700; line-height: 1.4; margin-bottom: 26px; box-shadow: 0 5px 0 var(--ink); }
.bubble::after { content: ""; position: absolute; left: -15px; bottom: 16px; width: 22px; height: 22px; background: inherit; border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg) skew(10deg, 10deg); }
.coach.good .bubble { background: var(--leaf-l); }
.coach.bad .bubble { background: var(--berry-l); }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: 0 7px 0 var(--ink); padding: 18px; display: grid; gap: 14px; }
.panel.enter { animation: rise .35s ease-out; }
.panel h3 { font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
.panel h3 .ico { color: var(--fox); width: 30px; height: 30px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slot { min-width: 90px; min-height: 46px; display: grid; place-items: center; padding: 6px 12px; border-radius: 14px; border: 3px dashed var(--ink-3); color: var(--ink-3); font-family: var(--f-display); font-size: 1.15rem; }
.slot.ok { border: 3px solid var(--leaf-d); background: var(--leaf-l); color: var(--ink); animation: pop .4s ease-out; }
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.op {
  font-family: var(--f-display); font-size: clamp(1.25rem, 3vw, 1.6rem); letter-spacing: .02em; min-height: 78px;
  border: 3px solid var(--ink); border-radius: 18px; background: var(--paper); box-shadow: 0 5px 0 var(--ink); padding: 8px; font-variant-numeric: tabular-nums;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px;
}
.op:hover { background-color: var(--gold-l); }
.op:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.op.wrong { opacity: .45; text-decoration: line-through; text-decoration-color: var(--berry); text-decoration-thickness: 3px; background-color: var(--berry-l); box-shadow: 0 2px 0 var(--ink); transform: translateY(3px); cursor: default; }
.op.right { background: var(--leaf-l); border-color: var(--leaf-d); animation: pop .4s ease-out; }
.hint-line { font-family: var(--f-hand); font-size: 1.45rem; color: var(--plum); line-height: 1.25; background: var(--plum-l); border-radius: 12px; padding: 6px 12px; }

/* recta numérica */
.nl { width: 100%; height: auto; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.nl:active { cursor: grabbing; }
.nl .track { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.nl .tick { stroke: var(--ink); stroke-width: 3; }
.nl .tick.minor { stroke: var(--ink-3); stroke-width: 2; }
.nl .lab { font: 400 20px var(--f-display); fill: var(--ink); }
.nl .zone { fill: var(--leaf); opacity: .22; }
.nl .marker-v { font: 400 22px var(--f-display); fill: #fff; }
.nl-tools { display: flex; gap: 10px; align-items: center; justify-content: center; }
.est-val { font-family: var(--f-display); font-size: 2rem; min-width: 5ch; text-align: center; font-variant-numeric: tabular-nums; }
.est-val small { font-size: .55em; color: var(--ink-2); }

/* cálculo */
.calc-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; font-family: var(--f-display); font-size: clamp(1.5rem, 4vw, 2.1rem); font-variant-numeric: tabular-nums; }
.answer-box { min-width: 4.5ch; padding: 4px 14px; border: 3px solid var(--ink); border-radius: 14px; background: var(--gold-l); text-align: center; min-height: 1.6em; box-shadow: inset 0 3px 0 rgba(34,48,79,.08); }
.answer-box.empty::after { content: "?"; color: var(--ink-3); }
.answer-box.caret::after { content: ""; display: inline-block; width: 3px; height: 1em; background: var(--fox); margin-left: 2px; vertical-align: -0.1em; animation: caret 1s steps(1) infinite; }
.unit { font-size: .7em; color: var(--ink-2); }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 360px; margin: 0 auto; width: 100%; }
.key { font-family: var(--f-display); font-size: 1.7rem; min-height: 62px; border: 3px solid var(--ink); border-radius: 16px; background: var(--paper); box-shadow: 0 4px 0 var(--ink); }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.key.fn { background: var(--sky-2); }
.key .ico { width: 28px; height: 28px; }
.calc-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* comprobación */
.check-q { font-family: var(--f-display); font-size: clamp(1.6rem, 4.4vw, 2.2rem); text-align: center; font-variant-numeric: tabular-nums; }
.bubbles { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* ---------- pizarra ---------- */

/* ---------- efectos ---------- */

.twinkle { animation: tw 2s ease-in-out infinite alternate; } .t1 { animation-delay: .7s; } .t2 { animation-delay: 1.3s; }
.bulb { animation: tw .9s steps(2) infinite; } .b1 { animation-delay: .3s; } .b2 { animation-delay: .6s; }

@keyframes drift { from { translate: -30px 0; } to { translate: 30px 0; } }

@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,47,.0); background: var(--blue-l); } 50% { box-shadow: 0 0 0 6px rgba(255,122,47,.45); background: var(--gold-l); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes rise { from { transform: translateY(14px); opacity: .4; } to { transform: none; opacity: 1; } }

<body>
<div id="app" aria-live="off"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* Detectives de Problemas: generadores de casos (sin DOM). Cada plantilla devuelve
   texto con datos marcados, la pregunta y las operaciones candidatas; build() añade
   respuesta, estimación, recta numérica y comprobación. */
(function (root) {
  'use strict';

  // ---------- azar ----------
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const int = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function shuffle(r, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const r6 = (x) => Math.round(x * 1e6) / 1e6;

  // ---------- números ----------
  function fmt(v, dec) {
    const neg = v < 0; v = Math.abs(v);
    let s = dec ? v.toFixed(dec) : String(r6(v));
    let [i, d] = s.split('.');
    if (i.length >= 5) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '−' : '') + i + (d ? ',' + d : '');
  }
  function parseNum(s) {
    const t = String(s).trim().replace(/\s/g, '');
    if (!/^\d+([.,]\d+)?$/.test(t)) return NaN;
    return Number(t.replace(',', '.'));
  }

  // ---------- expresiones ----------
  const L = (n, o) => Object.assign({ n }, o || {});
  const lf = (x) => (typeof x === 'number' ? L(x) : x);
  const E = (o, a, b) => ({ o, a: lf(a), b: lf(b) });
  const isLeaf = (e) => e.n !== undefined;
  function ev(e) {
    if (isLeaf(e)) return e.n;
    const a = ev(e.a), b = ev(e.b);
    switch (e.o) {
      case '+': return r6(a + b);
      case '−': return r6(a - b);
      case '×': return r6(a * b);
      default: return r6(a / b);
    }
  }
  const PREC = { '+': 1, '−': 1, '×': 2, '÷': 2 };
  function lbl(e) {
    if (isLeaf(e)) return fmt(e.n, e.dec);
    const left = !isLeaf(e.a) && PREC[e.a.o] !== PREC[e.o] ? '(' + lbl(e.a) + ')' : lbl(e.a);
    const right = isLeaf(e.b) ? lbl(e.b) : '(' + lbl(e.b) + ')';
    return left + ' ' + e.o + ' ' + right;
  }
  // a − b con el mayor delante (para opciones incorrectas que no den negativos)
  const sub = (a, b) => (ev(lf(a)) >= ev(lf(b)) ? E('−', a, b) : E('−', b, a));

  function roundLeaf(n) {
    if (!Number.isInteger(n)) return Math.round(n);
    if (n < 10) return n;
    if (n < 1000) return Math.round(n / 10) * 10;
    if (n < 10000) return Math.round(n / 100) * 100;
    return Math.round(n / 1000) * 1000;
  }
  function roundExpr(e) {
    if (isLeaf(e)) return e.keep ? e : L(roundLeaf(e.n), { dec: 0 });
    const a = roundExpr(e.a), b = roundExpr(e.b);
    if (e.o === '÷' && isLeaf(b) && b.n > 0) {
      // números compatibles: el dividendo pasa a un múltiplo del divisor
      const q = Math.max(1, Math.round(ev(a) / b.n));
      return E('÷', L(q * b.n), b);
    }
    return E(e.o, a, b);
  }
  // pasos de una expresión, de dentro afuera
  function steps(e, out) {
    out = out || [];
    if (isLeaf(e)) return out;
    steps(e.a, out); steps(e.b, out);
    const a = ev(e.a), b = ev(e.b);
    out.push({ a, o: e.o, b, v: ev(e), dec: e.a.dec || e.b.dec });
    return out;
  }
  function niceUp(x) {
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= x - 1e-9) return m * p;
    return 10 * p;
  }
  function niceStep(x, minStep) {
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    let s = 10 * p;
    for (const m of [1, 2, 5, 10]) if (m * p >= x) { s = m * p; break; }
    return Math.max(s, minStep);
  }

  // ---------- personas ----------
  const NAMES = [['Laia', 'f'], ['Pau', 'm'], ['Marc', 'm'], ['Júlia', 'f'], ['Nil', 'm'], ['Aina', 'f'], ['Hugo', 'm'],
    ['Lucía', 'f'], ['Martí', 'm'], ['Ona', 'f'], ['Leo', 'm'], ['Carla', 'f'], ['Biel', 'm'], ['Noa', 'f']];
  function person(r) {
    const [n, g] = pick(r, NAMES);
    const art = /^[AEIOUÀÈÉÍÒÓÚH]/.test(n) ? 'l’' : g === 'f' ? 'la ' : 'en ';
    return { es: n, ca: art + n, Ca: art.charAt(0).toUpperCase() + art.slice(1) + n };
  }
  const pad = (m) => String(m).padStart(2, '0');

  // ---------- deportes ----------
  const SPORTS = [
    { es: 'Fútbol', ca: 'Futbol', team: 11, color: '#3DB874', ball: 'foot' },
    { es: 'Baloncesto', ca: 'Bàsquet', team: 5, color: '#FF7A2F', ball: 'basket' },
    { es: 'Natación', ca: 'Natació', team: 0, color: '#36A9E1', ball: 'swim' },
    { es: 'Balonmano', ca: 'Handbol', team: 7, color: '#E8476A', ball: 'hand' },
    { es: 'Patinaje', ca: 'Patinatge', team: 0, color: '#8E6CDB', ball: 'skate' },
  ];
  function bars(r, tr) {
    const used = new Set();
    return SPORTS.map((s, i) => {
      let v; do { v = int(r, 12, 64); } while (used.has(v)); used.add(v);
      return { k: 'b' + i, label: tr(s.es, s.ca), v, color: s.color, icon: s.ball, team: s.team };
    });
  }
  const barTok = (items, useful) => {
    const tok = {};
    items.forEach((it) => { tok[it.k] = { t: it.label + ': ' + it.v, u: useful.includes(it.k) ? 1 : 0, chart: 1 }; });
    return tok;
  };
  const low = (s) => s.toLowerCase();

  // ---------- plantillas ----------
  // gen(r, tr) → { area, text, tok, q, unit, exprs[0]=correcta, answer?, dec?, hints?, check?, sol?, opHint?, calcTip?, chart? }
  const T = {};

  // ===== EL MERCADO: sumar y restar =====
  T.m1 = (r, tr) => {
    const a = int(r, 150, 480), h = pick(r, [8, 9]);
    let b; do { b = int(r, 120, 399); } while (b === a);
    return {
      area: 'calc',
      text: tr('Por la mañana, la frutería del mercado vendió {a} de fruta y por la tarde vendió {b}. La frutería abre a las {h} de la mañana.',
        'Al matí, la fruiteria del mercat va vendre {a} de fruita i a la tarda en va vendre {b}. La fruiteria obre a les {h} del matí.'),
      tok: { a: { t: a + ' kg', u: 1 }, b: { t: b + ' kg', u: 1 }, h: { t: String(h) } },
      q: tr('¿Cuántos kilos de fruta vendió en todo el día?', 'Quants quilos de fruita va vendre en tot el dia?'),
      unit: 'kg',
      exprs: [E('+', a, b), sub(a, b), E('×', a, b), E('+', a, h)],
    };
  };
  T.m2 = (r, tr) => {
    const p = person(r), c = pick(r, [100, 200, 500]);
    const a = c === 100 ? int(r, 35, 94) : c === 200 ? int(r, 105, 189) : int(r, 215, 480);
    const d = int(r, 30, 90) * 10;
    return {
      area: 'calc',
      text: tr(`${p.es} compra un patinete que cuesta {a} y paga con un billete de {c}. Lo usará para ir al colegio, que está a {d} de su casa.`,
        `${p.Ca} compra un patinet que costa {a} i paga amb un bitllet de {c}. El farà servir per anar a l’escola, que és a {d} de casa seva.`),
      tok: { a: { t: a + ' €', u: 1 }, c: { t: c + ' €', u: 1 }, d: { t: d + tr(' metros', ' metres') } },
      q: tr('¿Cuánto dinero le tienen que devolver?', 'Quants diners li han de tornar?'),
      unit: '€',
      exprs: [E('−', c, a), E('+', c, a), sub(d, a), sub(c, d)],
    };
  };
  T.m3 = (r, tr) => {
    const p = person(r), a = int(r, 220, 520), b = a - int(r, 40, 180), pr = pick(r, [2, 3]);
    return {
      area: 'calc',
      text: tr(`${p.es} tiene un puesto en el mercado. El sábado vendió {a} de naranjas y el domingo, {b}. Cada kilo cuesta {p}.`,
        `${p.Ca} té una parada al mercat. Dissabte va vendre {a} de taronges i diumenge, {b}. Cada quilo costa {p}.`),
      tok: { a: { t: a + ' kg', u: 1 }, b: { t: b + ' kg', u: 1 }, p: { t: pr + ' €' } },
      q: tr('¿Cuántos kilos más vendió el sábado que el domingo?', 'Quants quilos més va vendre dissabte que diumenge?'),
      unit: 'kg',
      exprs: [E('−', a, b), E('+', a, b), E('×', a, pr), E('−', a, pr)],
    };
  };
  T.m4 = (r, tr) => {
    const p = person(r), a = int(r, 180, 450), b = int(r, 60, a - 40), g = pick(r, [6, 18, 21]);
    return {
      area: 'calc',
      text: tr(`${p.es} quiere comprarse una bicicleta que cuesta {a}. Ya ha ahorrado {b}. La bicicleta tiene {g} marchas.`,
        `${p.Ca} es vol comprar una bicicleta que costa {a}. Ja ha estalviat {b}. La bicicleta té {g} marxes.`),
      tok: { a: { t: a + ' €', u: 1 }, b: { t: b + ' €', u: 1 }, g: { t: String(g) } },
      q: tr('¿Cuánto dinero le falta para poder comprarla?', 'Quants diners li falten per poder-la comprar?'),
      unit: '€',
      exprs: [E('−', a, b), E('+', a, b), E('−', a, g), sub(b, g)],
    };
  };
  T.m5 = (r, tr) => {
    const p = person(r), cents = [0.25, 0.5, 0.75, 0.2, 0.4, 0.6, 0.8];
    const a = r6(int(r, 2, 6) + pick(r, cents)), n = int(r, 3, 6);
    let b; do { b = r6(int(r, 1, 5) + pick(r, cents)); } while (b === a);
    const A = L(a, { dec: 2 }), B = L(b, { dec: 2 });
    return {

  function parseText(text, tok) {

    cands.unshift(other);
    const opts = [ok];
    for (const c of cands) {
      const v = r6(c);
      if (opts.length >= 3) break;
      if (v > 0 && !opts.some((x) => Math.abs(x - v) < 1e-9) && (dec || Number.isInteger(v))) opts.push(v);
    }
    const leaf = isLeaf(correct.a);
    const msg = leaf
      ? tr(`¡Sale ${fmt(ok, dec)}, que es un dato del problema! Tu resultado encaja.`, `Surt ${fmt(ok, dec)}, que és una dada del problema! El teu resultat encaixa.`)
      : tr(`¡Sale ${fmt(ok, dec)}, el resultado del primer paso (${lbl(correct.a)})! Tu resultado encaja.`, `Surt ${fmt(ok, dec)}, el resultat del primer pas (${lbl(correct.a)})! El teu resultat encaixa.`);
    return { q: `${fmt(answer, dec)} ${inv} ${fmt(B, dec)} = ?`, opts, ok, msg };
  }

  function build(tplId, r, lang) {
    const tr = (es, ca) => (lang === 'ca' ? ca : es);
    const raw = T[tplId](r, tr);
    const dec = raw.dec || 0;
    const correct = raw.exprs[0];

    // opciones de operación: sin repetir etiqueta ni valor de la correcta
    const seen = new Set();
    const ops = [];
    raw.exprs.forEach((e, i) => {
      const l = lbl(e);
      if (seen.has(l)) return; seen.add(l);

    const rounded = roundExpr(correct);
    let est = ev(rounded);
    if (raw.answer !== undefined) est = Math.round(est);
    const same = lbl(rounded) === lbl(correct);
    const max = niceUp(Math.max(answer, est, 1) * 1.6);
    const step = niceStep(max / 40, dec ? 0.5 : 1);
    const tol = Math.max(answer * 0.2, Math.abs(answer - est) * 1.25, step);
    const check = raw.check || makeCheck(correct, answer, tr, dec);
    const solSteps = raw.answer !== undefined ? [] : steps(correct).map((s) => `${fmt(s.a, s.dec)} ${s.o} ${fmt(s.b, s.dec)} = ${fmt(s.v, dec && !Number.isInteger(s.v) ? 2 : 0)}`);

      est: { value: est, label: same ? null : lbl(rounded) + ' ≈ ' + fmt(est, dec && !Number.isInteger(est) ? 2 : 0), max, step, tol },
      check: { q: check.q, opts: shuffle(r, check.opts), ok: check.ok, msg: check.msg },
      hints: raw.hints || {}, opHint: raw.opHint || null, calcTip: raw.calcTip || null,
      sol: solSteps, solNote: raw.sol || null,
      // distractores para el simulacro: resultados de las operaciones equivocadas
      wrongValues: ops.filter((o) => !o.ok).map((o) => o.value).concat(raw.answer !== undefined ? [ev(correct) > answer ? answer - 1 : answer + 1] : []),
    };
  }

  function worldRun(wid, lang, r) {
    r = r || Math.random;
    const w = WORLDS.find((x) => x.id === wid);
    const order = shuffle(r, w.tpls);

    for (let i = 0; i < 5; i++) list.push(build(order[i % order.length], r, lang));

      }
      return Object.assign(p, { mode: 'mc', choices: shuffle(r, vals) });

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.Content = API;

  };
  const t = (k, ...a) => { const v = STR[save.lang][k]; return typeof v === 'function' ? v(...a) : v; };
  const wname = (w) => (save.lang === 'ca' ? w.ca : w.es);

  // ---------- rangos y accesorios ----------
  const RANKS = [0, 10, 30, 55, 80];
  const ITEMS = [['scarf', 10], ['glasses', 25], ['cape', 45], ['crown', 70]];
  const totalStars = () => C.WORLDS.reduce((s, w) => s + (save.best[w.id] || 0), 0);
  const rankOf = (n) => RANKS.reduce((r, v, i) => (n >= v ? i : r), 0);
  const eqOn = () => { const n = totalStars(), e = {}; ITEMS.forEach(([k, at]) => { if (n >= at && save.eq[k]) e[k] = true; }); return e; };
  const worldStars3 = (best) => (best >= 14 ? 3 : best >= 10 ? 2 : best > 0 ? 1 : 0);
  const unlocked = (i) => save.unlockAll || i === 0 || (save.best[C.WORLDS[i - 1].id] || 0) > 0;

  // ---------- sonido ----------
  const Snd = {
    ctx: null,
    ac() {
      if (save.mute) return null;
      try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { return null; }
      return this.ctx;
    },
    tone(f, d, type, vol, when, slide) {
      const c = this.ac(); if (!c) return;
      const t0 = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + d + 0.05);
    },
    tap() { this.tone(660, 0.07, 'triangle', 0.12); },
    good() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.18, i * 0.07)); },
    bad() { this.tone(220, 0.25, 'square', 0.07, 0, 150); },
    star() { [880, 1175, 1568, 2093].forEach((f, i) => this.tone(f, 0.25, 'sine', 0.14, i * 0.09)); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.2, i * 0.13)); },
  };

        const u = new SpeechSynthesisUtterance(text);

        if (v) u.voice = v;

        this.speaking = true; s.speak(u); render();
      } catch (e) { this.speaking = false; }
    },
    stop() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* nada */ } this.speaking = false; },
  };

  // ---------- confeti ----------
  const FX = {
    cv: document.getElementById('fx'), parts: [], running: false,
    burst(n, x, y) {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const W = window.innerWidth, H = window.innerHeight, cols = ['#FF7A2F', '#FFC23D', '#2FB36B', '#36A9E1', '#E8476A', '#5B4BB7'];
      x = x == null ? W / 2 : x; y = y == null ? H / 3 : y;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
        this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: 5 + Math.random() * 6, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, life: 90 + Math.random() * 50, star: Math.random() < 0.3 });
      }
      if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); }
    },
    loop() {
      const cv = this.cv, dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
      if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
      const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
      this.parts = this.parts.filter((p) => p.life > 0 && p.y < H + 40);
      for (const p of this.parts) {
        p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = Math.min(1, p.life / 30); g.fillStyle = p.c;
        if (p.star) { g.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? p.r * 0.45 : p.r, a = -Math.PI / 2 + (i * Math.PI) / 5; g.lineTo(rr * Math.cos(a), rr * Math.sin(a)); } g.fill(); }
        else g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        g.restore();
      }
      if (this.parts.length) requestAnimationFrame(() => this.loop());
      else { this.running = false; g.clearRect(0, 0, W, H); }
    },
  };

  // ---------- pizarra ----------
  const Board = {
    el: null, cv: null, strokes: [], cur: null, color: '#F3F7EF',
    open(ref) {
      if (!this.el) {
        this.el = document.createElement('div'); this.el.className = 'board'; this.el.hidden = true;
        this.el.innerHTML = `<div class="board-in" role="dialog" aria-modal="true"><div class="board-bar"><span class="ref"></span><span class="btns">
          <button class="btn small white" data-b="clear">${''}</button><button class="btn small" data-b="close"></button></span></div><canvas></canvas></div>`;
        document.body.appendChild(this.el);
        this.cv = this.el.querySelector('canvas');
        this.el.addEventListener('click', (e) => {
          const b = e.target.closest('[data-b]'); if (b) { if (b.dataset.b === 'clear') { this.strokes = []; this.draw(); } else this.close(); }
          else if (e.target === this.el) this.close();
        });
        const pos = (e) => { const r = this.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
        this.cv.addEventListener('pointerdown', (e) => { this.cv.setPointerCapture(e.pointerId); this.cur = [pos(e)]; this.strokes.push(this.cur); this.draw(); });
        this.cv.addEventListener('pointermove', (e) => { if (this.cur) { this.cur.push(pos(e)); this.draw(); } });
        const end = () => { this.cur = null; };
        this.cv.addEventListener('pointerup', end); this.cv.addEventListener('pointercancel', end);
        window.addEventListener('resize', () => { if (!this.el.hidden) this.fit(); });
      }
      this.el.querySelector('[data-b=clear]').textContent = t('clear');
      this.el.querySelector('[data-b=close]').textContent = t('close');
      this.el.querySelector('.ref').textContent = ref || '';
      this.el.hidden = false; this.fit();
      this.el.querySelector('[data-b=close]').focus();
    },
    close() { if (this.el) this.el.hidden = true; },
    reset() { this.strokes = []; },
    fit() { const r = this.cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; this.cv.width = r.width * d; this.cv.height = r.height * d; this.draw(); },
    draw() {
      const g = this.cv.getContext('2d'), d = window.devicePixelRatio || 1;
      g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, this.cv.width, this.cv.height);
      g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1;
      const w = this.cv.width / d, h = this.cv.height / d;
      for (let x = 0; x < w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
      for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      g.strokeStyle = this.color; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
      for (const s of this.strokes) { g.beginPath(); s.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); if (s.length === 1) g.lineTo(s[0][0] + 0.1, s[0][1]); g.stroke(); }
    },
  };

  // ---------- estado ----------

  // ---------- piezas comunes ----------
  const soundBtn = () => `<button class="icon-btn" data-act="sound" aria-label="${save.mute ? t('soundOff') : t('soundOn')}" title="${save.mute ? t('soundOff') : t('soundOn')}">${A.icon(save.mute ? 'mute' : 'sound')}</button>`;

  const coach = (mood, text, kind) => `<div class="coach ${kind || ''}"><div class="coach-fox">${A.fox(mood, eqOn())}</div><div class="bubble" role="status" aria-live="polite">${text}</div></div>`;
  const fv = (prob, v) => fmt(v, prob.dec && !Number.isInteger(v) ? 2 : 0);

  function caseText(prob, st, interactive) {
    return prob.segs.map((s) => {
      if (s.s !== undefined) return esc(s.s);
      const tok = prob.tok[s.k];
      let cls = 'tk';
      if (st && st.found.has(s.k)) cls += ' ok';

  function chartBox(prob, st, interactive) {

  const speakText = (prob) => prob.segs.map((s) => (s.s !== undefined ? s.s : prob.tok[s.k].t)).join('') + ' ' + prob.q;

  // ---------- recta numérica ----------
  function nlGeom(e) { return { W: 640, x0: 40, x1: 600, y: 92, max: e.max }; }
  function nlX(g, v) { return g.x0 + ((g.x1 - g.x0) * v) / g.max; }
  function numberLine(prob, mode, vals) {
    const e = prob.est, g = nlGeom(e), dec = prob.dec;
    let s = `<line class="track" x1="${g.x0}" y1="${g.y}" x2="${g.x1}" y2="${g.y}"/>`;
    const mant = e.max / Math.pow(10, Math.floor(Math.log10(e.max) + 1e-9)), every = Math.abs(mant - 2) < 1e-9 ? 5 : 4;
    for (let i = 0; i <= 20; i++) {
      const v = (e.max * i) / 20, x = nlX(g, v), major = i % every === 0;
      s += `<line class="tick ${major ? '' : 'minor'}" x1="${x}" y1="${g.y - (major ? 14 : 8)}" x2="${x}" y2="${g.y + (major ? 14 : 8)}"/>`;
      if (major) s += `<text class="lab" x="${x}" y="${g.y + 42}" text-anchor="middle">${fmt(v, dec && !Number.isInteger(v) ? 1 : 0)}</text>`;

        <text class="marker-v" x="0" y="${g.y - 42 - dy}" text-anchor="middle">${label}</text></g>`;
    };
    if (mode === 'edit') {
      const v = vals.v;
      s += `<g id="nl-marker" transform="translate(${nlX(g, v)} 0)"><circle cx="0" cy="${g.y}" r="17" fill="rgba(190,235,255,.7)" stroke="#6E5235" stroke-width="5"/><rect x="9" y="${g.y + 10}" width="8" height="26" rx="4" transform="rotate(-35 13 ${g.y + 23})" fill="#6E5235"/>
        <path d="M0 ${g.y - 20} L-9 ${g.y - 32} L9 ${g.y - 32} Z" fill="#FF7A2F"/><rect x="-42" y="${g.y - 74}" width="84" height="42" rx="12" fill="#FF7A2F" stroke="#22304F" stroke-width="3"/>
        <text id="nl-val" class="marker-v" x="0" y="${g.y - 45}" text-anchor="middle">${fmt(v, dec && !Number.isInteger(v) ? 1 : 0)}</text></g>`;
      if (vals.reveal != null) s = s.replace('<g id="nl-marker"', marker(vals.reveal, '#2FB36B', fmt(vals.reveal, 0)) + '<g id="nl-marker"');
    } else {
      const lo = Math.max(0, prob.answer - e.tol), hi = Math.min(e.max, prob.answer + e.tol);
      s = `<rect class="zone" x="${nlX(g, lo)}" y="${g.y - 10}" width="${nlX(g, hi) - nlX(g, lo)}" height="20" rx="10"/>` + s;
      const close = vals.mine != null && Math.abs(nlX(g, vals.mine) - nlX(g, prob.answer)) < 80;
      if (vals.mine != null) s += marker(vals.mine, '#FF7A2F', fmt(vals.mine, dec && !Number.isInteger(vals.mine) ? 1 : 0), close);
      s += marker(prob.answer, '#2FB36B', fv(prob, prob.answer), false);
    }
    return `<svg class="nl" id="nl" viewBox="0 ${mode === 'edit' ? 0 : -44} ${g.W} ${mode === 'edit' ? 150 : 194}" ${mode === 'edit' ? 'tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="' + e.max + '" aria-valuenow="' + vals.v + '"' : 'aria-hidden="true"'}>${s}</svg>`;
  }
  function bindNumberLine() {
    const svg = document.getElementById('nl'); if (!svg || !S.run) return;
    const st = S.run.st, prob = st.prob, e = prob.est, g = nlGeom(e);
    const setV = (v) => {
      v = Math.max(0, Math.min(e.max, Math.round(v / e.step) * e.step));
      v = Math.round(v * 100) / 100;
      st.estVal = v;
      const m = document.getElementById('nl-marker'); if (m) m.setAttribute('transform', `translate(${nlX(g, v)} 0)`);
      const tx = document.getElementById('nl-val'); if (tx) tx.textContent = fmt(v, prob.dec && !Number.isInteger(v) ? 1 : 0);
      const big = document.getElementById('est-big'); if (big) big.firstChild.textContent = fmt(v, prob.dec && !Number.isInteger(v) ? 1 : 0) + ' ';
      svg.setAttribute('aria-valuenow', v);
    };
    const fromEvent = (ev) => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return ((p.x - g.x0) / (g.x1 - g.x0)) * e.max;
    };
    let drag = false, moved = false;
    svg.addEventListener('pointerdown', (ev) => { if (st.estLocked) return; drag = true; moved = false; svg.setPointerCapture(ev.pointerId); setV(fromEvent(ev)); });
    svg.addEventListener('pointermove', (ev) => { if (drag) { moved = true; setV(fromEvent(ev)); } });
    const end = () => { if (drag) { drag = false; Snd.tap(); } };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('keydown', (ev) => {
      if (st.estLocked) return;
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { setV(st.estVal + e.step); ev.preventDefault(); }
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { setV(st.estVal - e.step); ev.preventDefault(); }
    });
    S.nlSet = setV;
  }

  // ======================= PANTALLAS =======================
  function viewHome() {

    const method = PHASES.map((ph, i) => `<li>${A.icon(ph)}<b>${t('steps')[i]}</b><span>${t('stepsLong')[i]}</span></li>`).join('');
    return `<div class="home">

          <div class="home-actions">
            <button class="btn fox" data-act="goMap">${A.icon('map')} ${t('play')}</button>
            <button class="btn plum" data-act="goExam">${A.icon('trophy')} ${t('exam')}</button>
            <button class="btn white" data-act="goStats">${A.icon('chart')} ${t('progress')}</button>
          </div>
        </div>
      </section>
      <ol class="method method-wrap">${method}</ol>
    </div>`;
  }

  function viewMap() {
    const cur = C.WORLDS.findIndex((w, i) => unlocked(i) && !(save.best[w.id] > 0));
    const worlds = C.WORLDS.map((w, i) => ({ id: w.id, name: wname(w), stars: worldStars3(save.best[w.id] || 0), locked: !unlocked(i), current: i === (cur < 0 ? -1 : cur) }));
    return topbar(`<button class="icon-btn" data-act="goHome" aria-label="${t('home')}">${A.icon('home')}</button>`, `<h2>${t('map')}</h2>`, starCount() + soundBtn()) +
      `<div class="map-wrap"><div class="map-scroll">${A.map(worlds, save.lang, eqOn())}</div></div><p class="map-hint">${t('mapHint')}</p>`;
  }

  function startWorld(wid) {
    S.run = { wid, list: C.worldRun(wid, save.lang), idx: 0, results: [] };
    newProblem(); go('play');
  }
  function newProblem() {
    const prob = S.run.list[S.run.idx];
    S.run.st = { prob, phase: 'read', found: new Set(), bad: null, hintK: null, opWrong: new Set(), opOk: false, estVal: Math.round((prob.est.max / 2) / prob.est.step) * prob.est.step, estTries: 0, estTip: false, estLocked: false, estReveal: null, mine: null, input: '', calcTries: 0, calcOk: false, revealed: false, checkWrong: new Set(), checkOk: false, mistakes: 0, first: { read: true, op: true, est: true, calc: true, check: true }, msg: null, enter: true };
    Board.reset(); S.flash = null;
  }
  const usefulKeys = (prob) => Object.keys(prob.tok).filter((k) => prob.tok[k].u);
  function setPhase(ph) {
    const st = S.run.st, prev = st.phase;
    if (PHASES.includes(prev)) {
      save.phase[prev][1]++; if (st.first[prev]) save.phase[prev][0]++; persist();
    }
    st.phase = ph; st.msg = null; st.enter = true; S.flash = null;
    if (ph === 'done') finishProblem();
    render();
  }

  function viewPlay() {
    const run = S.run, st = run.st, prob = st.prob, w = C.WORLDS.find((x) => x.id === run.wid);
    const pips = run.list.map((_, i) => { const r = run.results[i]; return `<span class="pip ${r ? 's' + r : i === run.idx ? 'now' : ''}"></span>`; }).join('');
    const idx = st.phase === 'done' ? 5 : PHASES.indexOf(st.phase);
    const stepper = `<ol class="stepper" aria-label="Pasos">${PHASES.map((ph, i) => `<li class="${i < idx ? 'done' : i === idx ? 'now' : ''}" ${i === idx ? 'aria-current="step"' : ''}>${A.icon(ph)}<span class="st-l">${t('steps')[i]}</span></li>`).join('')}</ol>`;
    const interactive = st.phase === 'read';
    const card = `<section class="case-col">
      <div class="scene-wrap">${A.scene(run.wid, save.lang)}</div>
      <article class="notebook case-card">
        <div class="case-head"><span class="case-tag">${t('caseTag', run.idx + 1)}</span>
          <button class="listen" data-act="listen">${A.icon('sound')} ${Voice.speaking ? t('stop') : t('listen')}</button></div>
        <p class="case-text">${caseText(prob, st, interactive)}</p>
        ${chartBox(prob, st, interactive)}
        <div class="question">${qIcon}<span>${esc(prob.q)}</span></div>
      </article></section>`;
    return topbar(`<button class="icon-btn" data-act="goMap" aria-label="${t('backMap')}">${A.icon('back')}</button>`,
      `<h2>${wname(w)}</h2><div class="pips" aria-label="${t('caseN', run.idx + 1, run.list.length)}">${pips}</div>`, soundBtn()) +
      stepper + `<div class="play-grid">${card}<section class="panel-col">${panel(st)}</section></div>`;
  }

  function panel(st) {
    const prob = st.prob, enter = st.enter ? ' enter' : '';
    st.enter = false;
    const m = st.msg;
    if (st.phase === 'read') {
      const need = usefulKeys(prob);
      const slots = need.map((k) => (st.found.has(k) ? `<span class="slot ok">${esc(prob.tok[k].t)}</span>` : '<span class="slot">?</span>')).join('');
      return coach(m ? m.mood : 'think', m ? m.text : t(prob.chart ? 'readChart' : 'read'), m && m.kind) +
        `<div class="panel${enter}"><h3>${A.icon('read')} ${t('clues', st.found.size, need.length)}</h3><div class="slots">${slots}</div>
        <div><button class="btn small white" data-act="hint">${t('hintBtn')}</button></div></div>`;
    }
    if (st.phase === 'op') {
      const two = prob.area === 'dospassos';
      const ops = prob.ops.map((o, i) => `<button class="op ${st.opWrong.has(i) ? 'wrong' : ''} ${st.opOk && o.ok ? 'right' : ''}" data-act="op" data-i="${i}" ${st.opWrong.has(i) || st.opOk ? 'aria-disabled="true"' : ''}>${esc(o.label)}</button>`).join('');
      return coach(m ? m.mood : 'think', m ? m.text : t(two ? 'opTwo' : 'op'), m && m.kind) + `<div class="panel${enter}"><h3>${A.icon('op')} ${t('steps')[1]}</h3><div class="ops">${ops}</div></div>`;
    }
    if (st.phase === 'est') {
      const e = prob.est;
      const tip = st.estTip ? `<p class="hint-line">${e.label ? t('estTip', e.label) : t('estTipEasy')}</p>` : '';
      const actions = st.estLocked
        ? `<button class="btn leaf wide" data-act="estNext">${t('cont')}</button>`
        : `<button class="btn fox wide" data-act="estOk">${t('estOk')}</button>${st.estTip ? '' : `<button class="btn small white" data-act="estTip">${t('estTipBtn')}</button>`}`;
      return coach(m ? m.mood : 'think', m ? m.text : t('est'), m && m.kind) +
        `<div class="panel${enter}"><h3>${A.icon('est')} ${t('steps')[2]}: <span style="color:var(--ink-2)">${esc(prob.correctLabel)}</span></h3>
        ${numberLine(prob, 'edit', { v: st.estVal, reveal: st.estReveal })}
        <div class="nl-tools"><button class="key fn" style="width:56px" data-act="estStep" data-d="-1" aria-label="menos">−</button>
          <span class="est-val" id="est-big">${fmt(st.estVal, prob.dec && !Number.isInteger(st.estVal) ? 1 : 0)} <small>${esc(prob.unit)}</small></span>
          <button class="key fn" style="width:56px" data-act="estStep" data-d="1" aria-label="más">+</button></div>
        ${tip}<div style="display:grid;gap:10px">${actions}</div></div>`;
    }
    if (st.phase === 'calc') {
      const disp = st.input === '' ? '' : esc(st.input);
      const keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', ',', '0', 'del'].map((k) => k === 'del'
        ? `<button class="key fn" data-act="key" data-k="del" aria-label="borrar">${A.icon('del')}</button>`
        : `<button class="key ${k === ',' ? 'fn' : ''}" data-act="key" data-k="${k}">${k}</button>`).join('');
      const tip = prob.calcTip && !m ? `<p class="hint-line">${esc(prob.calcTip)}</p>` : '';
      const actions = st.revealed
        ? `<button class="btn leaf wide" data-act="calcNext">${t('cont')}</button>`
        : `<div class="calc-actions"><button class="btn small white" data-act="board">${A.icon('board')} ${t('board')}</button><button class="btn leaf" data-act="calcOk" style="flex:1">${t('ready')}</button></div>`;
      return coach(m ? m.mood : 'think', m ? m.text : t('calc'), m && m.kind) +
        `<div class="panel${enter}"><h3>${A.icon('calc')} ${t('steps')[3]}</h3>
        <div class="calc-line"><span>${esc(prob.correctLabel)} =</span><span class="answer-box ${disp ? '' : 'empty'} ${st.revealed ? '' : 'caret'}" id="calc-display">${disp}</span><span class="unit">${esc(prob.unit)}</span></div>
        ${tip}${st.revealed ? '' : `<div class="keypad">${keys}</div>`}${actions}</div>`;
    }
    if (st.phase === 'check') {
      const c = prob.check;
      const bubs = c.opts.map((v, i) => `<button class="bub ${st.checkWrong.has(i) ? 'wrong' : ''} ${st.checkOk && v === c.ok ? 'right' : ''}" data-act="chk" data-i="${i}">${fv(prob, v)}</button>`).join('');
      return coach(m ? m.mood : 'think', m ? m.text : t('check'), m && m.kind) +
        `<div class="panel${enter}"><h3>${A.icon('check')} ${t('steps')[4]}</h3><div class="check-q">${esc(c.q.replace(/(\d)\.(\d{1,2})(?!\d)/g, '$1,$2'))}</div><div class="bubbles">${bubs}</div></div>`;
    }
    // done
    const stars = S.run.results[S.run.idx] || 1;
    const last = S.run.idx === S.run.list.length - 1;
    const sol = prob.sol.map((l) => `<div>${esc(l)}</div>`).join('');
    return coach('wow', t('done'), 'good') +
      `<div class="panel${enter}"><div class="done-stars">${A.starsSvg(stars, 3, 60)}</div>
      <h3>${A.icon('check')} ${t('solution')}</h3>
      <div class="sol">${sol}<div><b>${fv(prob, prob.answer)} ${esc(prob.unit)}</b></div></div>
      ${prob.solNote ? `<p class="sol-note">${esc(prob.solNote)}</p>` : ''}
      ${numberLine(prob, 'result', { mine: st.mine })}
      <div class="legend"><span><i style="background:#FF7A2F"></i>${t('yourEst')}</span><span><i style="background:#2FB36B"></i>${t('result')}</span></div>
      <button class="btn fox wide" data-act="${last ? 'finishWorld' : 'nextCase'}">${last ? t('finish') : t('next')}</button></div>`;
  }

  function finishProblem() {
    const st = S.run.st;
    const stars = st.mistakes === 0 ? 3 : st.mistakes <= 2 ? 2 : 1;
    S.run.results[S.run.idx] = stars;
    save.solved++; persist();
    Snd.star(); FX.burst(stars * 30);
  }

  function viewWorldEnd() {
    const run = S.run, w = C.WORLDS.find((x) => x.id === run.wid), sum = run.results.reduce((a, b) => a + b, 0);
    const ev = run.endEvents || [];
    const rows = run.list.map((p, i) => `<div class="case-row"><span class="n">${i + 1}</span><span class="t">${esc(p.q)}</span>${A.starsSvg(run.results[i] || 0, 3, 22)}</div>`).join('');
    return `<div class="result"><div class="result-card">
      ${A.fox('wow', eqOn())}
      <h1>${t('worldDone')}</h1>
      <div class="big-stars">${A.starsSvg(worldStars3(sum), 3, 80)}</div>
      <p style="font-weight:700;font-size:1.2rem">${wname(w)} · ${t('worldStars', sum)}</p>
      ${ev.length ? `<div class="chips">${ev.map((e) => `<span class="chip new">${esc(e)}</span>`).join('')}</div>` : ''}
      <div class="case-list">${rows}</div>
      <div class="row-actions"><button class="btn fox" data-act="goMap">${A.icon('map')} ${t('backMap')}</button><button class="btn white" data-act="again">${t('again')}</button></div>
    </div></div>`;
  }
  function finishWorld() {
    const run = S.run, sum = run.results.reduce((a, b) => a + b, 0);
    const before = totalStars(), rkB = rankOf(before), unlockedB = C.WORLDS.map((_, i) => unlocked(i));
    const ev = [];
    if (sum > (save.best[run.wid] || 0)) { if (save.best[run.wid]) ev.push(t('record')); save.best[run.wid] = sum; }
    const after = totalStars();
    C.WORLDS.forEach((w, i) => { if (!unlockedB[i] && unlocked(i)) ev.push(t('opened', wname(w))); });
    ITEMS.forEach(([k, at]) => { if (before < at && after >= at) { ev.push(t('newItem', t('items')[k])); save.eq[k] = true; } });
    if (rankOf(after) > rkB) ev.push(t('newRank', t('ranks')[rankOf(after)]));
    persist();
    run.endEvents = ev;
    Snd.win(); FX.burst(160); setTimeout(() => FX.burst(120, window.innerWidth * 0.25, window.innerHeight * 0.4), 350); setTimeout(() => FX.burst(120, window.innerWidth * 0.75, window.innerHeight * 0.4), 650);
    go('worldEnd');
  }

  // ---------- acciones de juego ----------
  function tapToken(k) {
    const st = S.run.st; if (st.phase !== 'read' || st.lock) return;
    const tok = st.prob.tok[k]; if (!tok || st.found.has(k)) return;
    if (tok.u) {
      st.found.add(k); st.bad = null; st.hintK = null; S.flash = k; Snd.good();
      if (usefulKeys(st.prob).every((x) => st.found.has(x))) {
        st.msg = { text: t('readDone'), mood: 'happy', kind: 'good' }; st.lock = true; render();
        later(() => { st.lock = false; setPhase('op'); }, 1100);
      } else { st.msg = { text: t('readGood'), mood: 'happy', kind: 'good' }; render(); }
    } else {
      st.bad = k; st.mistakes++; st.first.read = false; S.flash = null; Snd.bad();
      st.msg = { text: t('readBad'), mood: 'sad', kind: 'bad' }; render();
    }
  }
  function hint() {
    const st = S.run.st; const k = usefulKeys(st.prob).find((x) => !st.found.has(x)); if (!k) return;
    st.hintK = k; st.first.read = false; st.mistakes++;
    st.msg = { text: t('hintMsg'), mood: 'think', kind: '' }; render();
  }
  function chooseOp(i) {
    const st = S.run.st, o = st.prob.ops[i]; if (!o || st.opOk || st.opWrong.has(i)) return;
    if (o.ok) {
      st.opOk = true; Snd.good(); st.msg = { text: t('opGood'), mood: 'happy', kind: 'good' }; render();
      later(() => setPhase('est'), 1000);
    } else {
      st.opWrong.add(i); st.mistakes++; st.first.op = false; Snd.bad();
      st.msg = { text: st.opWrong.size >= 2 && st.prob.opHint ? st.prob.opHint : t('opBad'), mood: 'sad', kind: 'bad' };
      render();
    }
  }
  function estConfirm() {
    const st = S.run.st, prob = st.prob, e = prob.est, v = st.estVal, A0 = prob.answer;
    if (Math.abs(v - A0) <= e.tol) {
      st.mine = v; st.estLocked = true; Snd.good(); st.msg = { text: t('estGood'), mood: 'happy', kind: 'good' }; render();
      later(() => setPhase('calc'), 1000);
      return;
    }
    st.estTries++; st.mistakes++; st.first.est = false; Snd.bad();
    if (st.estTries >= 2) {
      st.mine = v; st.estLocked = true; st.estReveal = Math.round(e.value);
      st.msg = { text: (v > A0 ? t('estHigh') : t('estLow')) + ' ' + t('estShow', fmt(e.value, prob.dec && !Number.isInteger(e.value) ? 2 : 0)), mood: 'think', kind: 'bad' };
    } else {
      st.estTip = true; st.msg = { text: v > A0 ? t('estHigh') : t('estLow'), mood: 'sad', kind: 'bad' };
    }
    render();
  }
  function key(k) {
    const st = S.run ? S.run.st : null;
    const target = S.screen === 'exam' ? S.exam : st;
    if (!target) return;
    if (S.screen === 'play' && (st.phase !== 'calc' || st.revealed || st.calcOk)) return;
    if (k === 'del') target.input = target.input.slice(0, -1);
    else if (k === ',') { if (!target.input.includes(',') && target.input !== '') target.input += ','; }
    else if (target.input.length < 8) target.input = target.input === '0' ? k : target.input + k;
    Snd.tap();
    const d = document.getElementById('calc-display');
    if (d) { d.textContent = target.input; d.classList.toggle('empty', target.input === ''); }
  }
  function calcOk() {
    const st = S.run.st, prob = st.prob;
    if (st.calcOk || st.revealed) return;
    const v = C.parseNum(st.input);
    if (isNaN(v)) { st.msg = { text: t('calcEmpty'), mood: 'think', kind: '' }; render(); return; }
    if (Math.abs(v - prob.answer) < 1e-6) {
      st.calcOk = true; Snd.good(); st.msg = { text: t('calcGood'), mood: 'happy', kind: 'good' }; render();
      later(() => setPhase('check'), 900);
      return;
    }
    st.calcTries++; st.mistakes++; st.first.calc = false; Snd.bad();
    const special = prob.hints[String(v)];
    const estShown = fmt(prob.est.value, prob.dec && !Number.isInteger(prob.est.value) ? 2 : 0);
    let text = special || (Math.abs(v - prob.answer) > prob.est.tol ? t('calcFar', estShown) : t('calcNear'));
    if (st.calcTries >= 3) { st.revealed = true; st.input = fv(prob, prob.answer); text = t('calcReveal', fv(prob, prob.answer) + ' ' + prob.unit); }
    else st.input = '';
    st.msg = { text, mood: 'sad', kind: 'bad' }; render();
    const box = document.getElementById('calc-display'); if (box) box.classList.add('shake');
  }
  function chooseCheck(i) {
    const st = S.run.st, c = st.prob.check, v = c.opts[i];
    if (st.checkOk || st.checkWrong.has(i)) return;
    if (v === c.ok) {
      st.checkOk = true; Snd.good(); st.msg = { text: c.msg, mood: 'happy', kind: 'good' }; render();
      later(() => setPhase('done'), 1900);
    } else {
      st.checkWrong.add(i); st.mistakes++; st.first.check = false; Snd.bad(); st.msg = { text: t('checkBad'), mood: 'sad', kind: 'bad' }; render();
    }
  }

  // ---------- simulacro ----------
  function startExam() { S.exam = { list: C.examRun(save.lang), idx: 0, ans: [], input: '', choice: null, t0: 0, started: false, done: false }; go('exam'); }
  function elapsed() { const s = Math.floor((Date.now() - S.exam.t0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function viewExam() {
    const ex = S.exam;
    const head = topbar(`<button class="icon-btn" data-act="goHome" aria-label="${t('exit')}">${A.icon('back')}</button>`, `<h2>${t('examTitle')}</h2>`, soundBtn());
    if (!ex.started) {
      return head + `<div class="exam"><div class="result-card exam-intro" style="margin:0 auto">${A.fox('think', eqOn())}<h2 style="font-size:2rem">${t('examTitle')}</h2><p style="font-size:1.15rem;max-width:52ch">${t('examIntro')}</p><button class="btn plum" data-act="examStart">${t('start')}</button></div></div>`;
    }
    const prob = ex.list[ex.idx];
    let ans;
    if (prob.mode === 'mc') {
      ans = `<p style="font-weight:700">${t('chooseOne')}</p><div class="choices">${prob.choices.map((v, i) => `<button class="choice" data-act="mc" data-i="${i}" aria-pressed="${ex.choice === i}"><span class="L">${'ABCD'[i]}</span>${fv(prob, v)} ${esc(prob.unit)}</button>`).join('')}</div>
        <button class="btn plum wide" data-act="examAns" ${ex.choice == null ? 'disabled' : ''}>${t('answer')}</button>`;
    } else {
      const keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', ',', '0', 'del'].map((k) => k === 'del'
        ? `<button class="key fn" data-act="key" data-k="del" aria-label="borrar">${A.icon('del')}</button>`
        : `<button class="key ${k === ',' ? 'fn' : ''}" data-act="key" data-k="${k}">${k}</button>`).join('');
      ans = `<p style="font-weight:700">${t('writeAns')}</p><div class="calc-line"><span class="answer-box ${ex.input ? '' : 'empty'} caret" id="calc-display">${esc(ex.input)}</span><span class="unit">${esc(prob.unit)}</span></div>
        <div class="keypad">${keys}</div><div class="calc-actions"><button class="btn small white" data-act="board">${A.icon('board')} ${t('board')}</button><button class="btn plum" style="flex:1" data-act="examAns">${t('answer')}</button></div>`;
    }
    return head + `<div class="exam">
      <div class="paper-head"><span>${t('qN', ex.idx + 1)}</span><span class="timer">${A.icon('clock')} <span id="timer">${elapsed()}</span></span></div>
      <article class="notebook case-card">
        <p class="case-text">${caseText(prob, null, false)}</p>
        ${chartBox(prob, null, false)}
        <div class="question">${qIcon}<span>${esc(prob.q)}</span></div>
        <div style="display:flex;justify-content:flex-end"><button class="listen" data-act="listen">${A.icon('sound')} ${Voice.speaking ? t('stop') : t('listen')}</button></div>
      </article>
      <div class="panel">${ans}</div></div>`;
  }
  function examAnswer() {
    const ex = S.exam, prob = ex.list[ex.idx];
    let v = null;
    if (prob.mode === 'mc') { if (ex.choice == null) return; v = prob.choices[ex.choice]; }
    else { v = C.parseNum(ex.input); if (isNaN(v)) { toast(t('calcEmpty')); return; } }
    ex.ans[ex.idx] = { v, ok: Math.abs(v - prob.answer) < 1e-6 };
    Snd.tap(); Voice.stop(); Board.reset();
    ex.choice = null; ex.input = '';
    if (ex.idx < ex.list.length - 1) { ex.idx++; render(); window.scrollTo(0, 0); return; }
    ex.done = true; ex.time = elapsed();
    const score = ex.ans.filter((a) => a.ok).length;
    const byArea = {};
    ex.list.forEach((p, i) => { byArea[p.area] = byArea[p.area] || [0, 0]; byArea[p.area][1]++; if (ex.ans[i] && ex.ans[i].ok) byArea[p.area][0]++; });
    ex.byArea = byArea; ex.score = score;
    save.exams.push({ d: new Date().toISOString().slice(0, 10), s: score, t: ex.time }); save.exams = save.exams.slice(-12); persist();
    Snd.win(); if (score >= 7) FX.burst(200);
    go('examEnd');
  }
  function ring(score) {
    const R = 70, Cc = 2 * Math.PI * R, f = score / 10;
    const col = score >= 7 ? '#2FB36B' : score >= 5 ? '#FFC23D' : '#E8476A';
    return `<svg class="score-ring" viewBox="0 0 180 180"><circle cx="90" cy="90" r="${R}" fill="#FFF6EE" stroke="#E2E8F2" stroke-width="18"/>
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${Cc * f} ${Cc}" transform="rotate(-90 90 90)"/>
      <circle cx="90" cy="90" r="${R + 11}" fill="none" stroke="#22304F" stroke-width="3"/><circle cx="90" cy="90" r="${R - 11}" fill="none" stroke="#22304F" stroke-width="3"/>
      <text x="90" y="104" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="44" fill="#22304F">${score}/10</text></svg>`;
  }
  function viewExamEnd() {
    const ex = S.exam;
    const areas = Object.keys(ex.byArea).map((k) => { const [a, b] = ex.byArea[k]; return `<div class="area-row"><span>${C.AREAS[k][save.lang === 'ca' ? 1 : 0]}</span><span class="v">${a}/${b}</span><div class="meter"><i style="width:${(a / b) * 100}%;background:${a === b ? 'var(--leaf)' : a / b >= 0.5 ? 'var(--gold)' : 'var(--berry)'}"></i></div></div>`; }).join('');
    const rev = ex.list.map((p, i) => {
      const a = ex.ans[i]; const ok = a && a.ok;
      return `<div class="rev ${ok ? 'ok' : 'ko'}"><span class="rq">${i + 1}. ${esc(p.q)}</span>
        <span class="ra">${t('yourAns')}: <b>${a ? fv(p, a.v) + ' ' + esc(p.unit) : t('noAns')}</b>${ok ? '' : ` · ${t('rightAns')}: <b>${fv(p, p.answer)} ${esc(p.unit)}</b> (${esc(p.solNote || p.sol.join('; '))})`}</span></div>`;
    }).join('');
    return topbar(`<button class="icon-btn" data-act="goHome" aria-label="${t('home')}">${A.icon('home')}</button>`, `<h2>${t('examDone')}</h2>`, soundBtn()) +
      `<div class="result"><div class="result-card">
        ${ring(ex.score)}
        <p style="font-weight:700;font-size:1.25rem">${t('examMsg', ex.score)}</p>
        <p style="color:var(--ink-2);font-weight:700">${t('time')}: ${ex.time}</p>
        <h2 style="align-self:start;justify-self:start">${t('byArea')}</h2><div class="areas">${areas}</div>
        <h2 style="justify-self:start">${t('review')}</h2><div class="review">${rev}</div>
        <div class="row-actions"><button class="btn plum" data-act="goExam">${t('again')}</button><button class="btn fox" data-act="goMap">${A.icon('map')} ${t('play')}</button></div>
      </div></div>`;
  }

  // ---------- progreso ----------
  function viewStats() {
    const n = totalStars(), rk = rankOf(n);
    const items = ITEMS.map(([k, at]) => { const open = n >= at; return `<button class="item" data-act="equip" data-k="${k}" aria-pressed="${open && !!save.eq[k]}" ${open ? '' : 'disabled'}>${t('items')[k]}<small>${open ? (save.eq[k] ? '✓' : '—') : t('unlockAt', at)}</small></button>`; }).join('');
    const worlds = C.WORLDS.map((w, i) => `<div class="wl-row"><div><b>${wname(w)}</b><small>${w.sub[save.lang === 'ca' ? 1 : 0]} · ${save.best[w.id] || 0}/15</small></div>${unlocked(i) ? A.starsSvg(worldStars3(save.best[w.id] || 0), 3, 26) : A.icon('lock', 'lock')}</div>`).join('');
    const ph = PHASES.map((p, i) => { const [a, b] = save.phase[p]; const pct = b ? Math.round((a / b) * 100) : 0; return { p, i, a, b, pct }; });
    const withData = ph.filter((x) => x.b > 0);
    const weakest = withData.length ? withData.reduce((m, x) => (x.pct < m.pct ? x : m)) : null;
    const phRows = ph.map((x) => `<div class="area-row"><span>${A.icon(x.p)} ${t('steps')[x.i]}</span><span class="v">${x.b ? x.pct + '%' : '—'}</span><div class="meter"><i style="width:${x.pct}%;background:${x.pct >= 75 ? 'var(--leaf)' : x.pct >= 50 ? 'var(--gold)' : 'var(--berry)'}"></i></div></div>`).join('');
    const exams = save.exams.length ? `<div class="wl">${save.exams.slice().reverse().slice(0, 6).map((e) => `<div class="wl-row"><div><b>${e.s}/10</b><small>${e.d} · ${e.t}</small></div><div class="meter" style="width:120px;margin:0"><i style="width:${e.s * 10}%;background:${e.s >= 7 ? 'var(--leaf)' : e.s >= 5 ? 'var(--gold)' : 'var(--berry)'}"></i></div></div>`).join('')}</div>` : `<p>${t('noExams')}</p>`;
    const reset = S.confirmReset
      ? `<div class="confirm"><span style="flex:1;min-width:12ch">${t('resetQ')}</span><button class="btn small" style="background:var(--berry);color:#fff" data-act="resetYes">${t('yes')}</button><button class="btn small white" data-act="resetNo">${t('cancel')}</button></div>`
      : `<button class="btn small white danger" data-act="reset">${t('reset')}</button>`;
    return topbar(`<button class="icon-btn" data-act="goHome" aria-label="${t('home')}">${A.icon('home')}</button>`, `<h2>${t('progress')}</h2>`, `<div class="lang" role="group" aria-label="Idioma / Llengua"><button data-act="lang" data-v="es" aria-pressed="${save.lang === 'es'}">ES</button><button data-act="lang" data-v="ca" aria-pressed="${save.lang === 'ca'}">CA</button></div>`) +
      `<div class="prog">
        <section class="card"><div class="rank-card">${A.badge(rk)}<div><b>${t('ranks')[rk]}</b><small>${n} ${t('stars')}</small></div></div>
          <h2>${t('wardrobe')}</h2><p>${t('wardrobeP')}</p><div class="wardrobe">${A.fox('happy', eqOn())}<div class="items">${items}</div></div></section>
        <section class="card"><h2>${t('phasesT')}</h2><p>${t('phasesP')}</p><div class="areas">${phRows}</div>
          <p style="font-weight:700;color:var(--ink)">${weakest ? t('weakest', t('steps')[weakest.i]) : t('noData')}</p></section>
        <section class="card"><h2>${t('places')}</h2><div class="wl">${worlds}</div></section>
        <section class="card"><h2>${t('exams')}</h2>${exams}</section>
        <section class="card family" style="grid-column:1/-1"><h2>${t('family')}</h2>${t('familyP').map((x) => `<p>${x}</p>`).join('')}
          <div class="row-actions" style="justify-content:flex-start">${save.unlockAll ? `<span class="chip">${t('unlocked')}</span>` : `<button class="btn small white" data-act="unlockAll">${t('unlockAll')}</button>`}${reset}</div></section>
      </div>`;
  }

  // ---------- render ----------
  let timerId = null;
  function render() {
    const views = { home: viewHome, map: viewMap, play: viewPlay, worldEnd: viewWorldEnd, exam: viewExam, examEnd: viewExamEnd, stats: viewStats };
    document.documentElement.lang = save.lang === 'ca' ? 'ca' : 'es';
    app.innerHTML = (views[S.screen] || viewHome)();
    if (S.screen === 'play' && S.run.st.phase === 'est') bindNumberLine();
    clearInterval(timerId);
    if (S.screen === 'exam' && S.exam && S.exam.started) timerId = setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = elapsed(); }, 1000);
  }

  // ---------- eventos ----------
  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, d = el.dataset;
    switch (act) {
      case 'lang': save.lang = d.v; persist(); Snd.tap(); render(); break;
      case 'sound': save.mute = !save.mute; persist(); if (!save.mute) Snd.good(); render(); break;
      case 'goHome': go('home'); break;
      case 'goMap': Snd.tap(); go('map'); break;
      case 'goStats': Snd.tap(); S.confirmReset = false; go('stats'); break;
      case 'goExam': Snd.tap(); startExam(); break;
      case 'world': {
        const i = C.WORLDS.findIndex((w) => w.id === d.id);
        if (!unlocked(i)) { Snd.bad(); toast(t('lockedToast')); break; }
        Snd.good(); startWorld(d.id); break;
      }
      case 'listen': { const prob = S.screen === 'exam' ? S.exam.list[S.exam.idx] : S.run.st.prob; Voice.say(speakText(prob)); break; }
      case 'tok': tapToken(d.k); break;
      case 'hint': hint(); break;
      case 'op': chooseOp(+d.i); break;
      case 'estStep': if (!S.run.st.estLocked && S.nlSet) { S.nlSet(S.run.st.estVal + (+d.d) * S.run.st.prob.est.step); Snd.tap(); } break;
      case 'estTip': S.run.st.estTip = true; Snd.tap(); render(); break;
      case 'estOk': estConfirm(); break;
      case 'estNext': setPhase('calc'); break;
      case 'key': key(d.k); break;
      case 'calcOk': calcOk(); break;
      case 'calcNext': setPhase('check'); break;
      case 'board': { const ref = S.screen === 'exam' ? S.exam.list[S.exam.idx].q : S.run.st.prob.correctLabel + ' = ?'; Board.open(ref); break; }
      case 'chk': chooseCheck(+d.i); break;
      case 'nextCase': S.run.idx++; newProblem(); Snd.tap(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
      case 'finishWorld': finishWorld(); break;
      case 'again': startWorld(S.run.wid); break;
      case 'examStart': S.exam.started = true; S.exam.t0 = Date.now(); Snd.good(); render(); break;
      case 'mc': S.exam.choice = +d.i; Snd.tap(); render(); break;
      case 'examAns': examAnswer(); break;
      case 'equip': save.eq[d.k] = !save.eq[d.k]; persist(); Snd.tap(); render(); break;
      case 'unlockAll': save.unlockAll = true; persist(); Snd.good(); render(); break;
      case 'reset': S.confirmReset = true; render(); break;
      case 'resetNo': S.confirmReset = false; render(); break;
      case 'resetYes': { const lang = save.lang; save = fresh(); save.lang = lang; persist(); S.confirmReset = false; render(); break; }
    }
  });
  app.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('svg [data-act], .spot')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    const typing = (S.screen === 'play' && S.run && S.run.st.phase === 'calc') || (S.screen === 'exam' && S.exam && S.exam.started && S.exam.list[S.exam.idx].mode === 'open');
    if (!typing || (Board.el && !Board.el.hidden)) { if (e.key === 'Escape') Board.close(); return; }
    if (/^[0-9]$/.test(e.key)) { key(e.key); e.preventDefault(); }
    else if (e.key === ',' || e.key === '.') { key(','); e.preventDefault(); }
    else if (e.key === 'Backspace') { key('del'); e.preventDefault(); }
    else if (e.key === 'Enter') { if (S.screen === 'exam') examAnswer(); else calcOk(); e.preventDefault(); }
  });

  // ganchos para pruebas automáticas
  window.__game = { S, save: () => save, go, startWorld, render, C };
  render();
})();

</script>
</body>
</html>
